plugins {
    id 'com.android.application'
}

android {
    // AAPT requires a dotted namespace even though the Java source tree uses the
    // single-segment package `ARKlector` (see note in docs/proposal). R is imported
    // explicitly from this namespace where needed.
    namespace 'org.arklector.app'
    compileSdk 35

    defaultConfig {
        applicationId "org.arklector.app"
        minSdk 34
        targetSdk 35
        versionCode 1
        versionName "0.1"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    // The committed debug.keystore is otherwise unused, so every CI run signed with a
    // freshly generated key and installs/Obtainium updates failed on signature mismatch.
    signingConfigs {
        debug {
            storeFile rootProject.file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildFeatures {
        // Explicitly off: no view binding/XML layout generation, no Compose.
        viewBinding false
        compose false
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.8.6'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.8.6'
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
